<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NewsShield</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .score-badge {
      font-size: 1.3rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 12px;
      background: #e2e8f0;
    }
    .score-good { background: #dcfce7; color: #15803d; }
    .score-warn { background: #fef9c3; color: #a16207; }
    .score-bad  { background: #fee2e2; color: #b91c1c; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.85rem;
    }
    .stat-label { color: #64748b; }
    .stat-val { font-weight: 600; }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 10px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #status {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>NewsShield <span style="font-size: 0.8rem; font-weight: normal;">v1.0</span></h2>

  <div id="scoreBox" class="score-badge">Click Analyze</div>

  <div class="stat-row">
    <span class="stat-label">Sensational Words:</span>
    <span class="stat-val" id="sensationalCount">-</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">ALL CAPS Ratio:</span>
    <span class="stat-val" id="capsRatio">-</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">Outbound Citations:</span>
    <span class="stat-val" id="citationCount">-</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">Protocol:</span>
    <span class="stat-val" id="securityStatus">-</span>
  </div>

  <button id="analyzeBtn">Analyze Current Page</button>
  <div id="status">Ready to scan article</div>

  <script src="popup.js"></script>
</body>
</html>
